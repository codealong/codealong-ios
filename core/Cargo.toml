# The phone app's Rust core: a thin layer over codealong-peer's client, which the Mac app's engine
# shares, so the phone speaks exactly what the Macs speak. UniFFI makes its Swift bindings.
[workspace]
members = [".", "bindgen"]

[package]
name = "codealong-mobile"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
name = "codealong_mobile"
# A static library alone: with an rlib beside it, the LTO below never reaches it.
crate-type = ["staticlib"]

[dependencies]
# The main repo's crate, pinned to a commit in its origin/main; move the pin to take a newer one
# (CLAUDE.md, "The main repo is the source of the protocol").
codealong-peer = { git = "https://github.com/codealong/codealong.git", rev = "08ea9293e3cba2ececee25db7ca2e9d485938aea" }
iroh = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uniffi = "0.32"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
